<title>Koreys tili 200</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: minimal phone-first Mini App — home hub → weeks → days → lesson; sticky bottom action */
:root{
  --bg:#F6F9FD; --card:#FFFFFF; --line:#E3EAF4; --soft:#EEF3FA;
  --ink:#1C2A44; --muted:#5D6B85;
  --sky:#3E97E0; --btn:#2B7BC0; --btn-ink:#FFFFFF; --sky-soft:#E3F0FC; --sky-ink:#1F6AA8;
  --pink:#E8578A; --pink-soft:#FCE6EE; --pink-ink:#B83A66;
  --sun-soft:#FDF4DF; --sun-ink:#8A6410; --mark:#F2CF7C;
  --ok:#167A50; --ok-soft:#DFF5EA; --bad:#B42E2E; --bad-soft:#FCE4E4;
  --hero:#1C2A44; --hero-ink:#FFFFFF; --hero-mut:#B9C6DD; --hero-line:#33466B; --sun:#F2CF7C;
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ko:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-han:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --card:#18223A; --line:#27344F; --soft:#1F2B45;
  --ink:#EAF0FA; --muted:#9AA8C2;
  --sky:#5AAEF0; --btn:#4C9DE6; --btn-ink:#0B1220; --sky-soft:#1C3352; --sky-ink:#8CC4F5;
  --pink:#F06C9B; --pink-soft:#3A2033; --pink-ink:#F59BBB;
  --sun-soft:#3A3322; --sun-ink:#F2CF7C; --mark:#8A6A1E;
  --ok:#5CCB94; --ok-soft:#173A2C; --bad:#F27E7E; --bad-soft:#3E1F24; --hero:#22325A; --hero-ink:#FFFFFF; --hero-mut:#B9C6DD; --hero-line:#36497A; --sun:#F2CF7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --card:#18223A; --line:#27344F; --soft:#1F2B45;
  --ink:#EAF0FA; --muted:#9AA8C2;
  --sky:#5AAEF0; --btn:#4C9DE6; --btn-ink:#0B1220; --sky-soft:#1C3352; --sky-ink:#8CC4F5;
  --pink:#F06C9B; --pink-soft:#3A2033; --pink-ink:#F59BBB;
  --sun-soft:#3A3322; --sun-ink:#F2CF7C; --mark:#8A6A1E;
  --ok:#5CCB94; --ok-soft:#173A2C; --bad:#F27E7E; --bad-soft:#3E1F24; --hero:#22325A; --hero-ink:#FFFFFF; --hero-mut:#B9C6DD; --hero-line:#36497A; --sun:#F2CF7C; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;text-align:left}
button:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
.app{max-width:480px;margin:0 auto}
.scr{display:flex;flex-direction:column;gap:14px;animation:in .2s ease}
@keyframes in{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
.ko{font-family:var(--f-ko)}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.top small{display:block;font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.in-tg .ib.back{display:none}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--sky);transition:width .35s}
.bar.pink i{background:var(--pink)}

/* home */
.hello{padding:18px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.av-btn{width:48px;height:48px;flex:0 0 auto;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:19px;overflow:hidden;margin-top:6px}
.av-btn img,.pf-av img{width:100%;height:100%;object-fit:cover}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 4px;text-align:center}
.pf-av{width:96px;height:96px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:38px;font-weight:700;overflow:hidden}
.pf-head h2{margin:6px 0 0;font-size:24px;font-weight:700}
.pf-head .u{font-size:14px;color:var(--muted)}
.pf-lvl{font-size:13px;font-weight:700;color:var(--sun-ink);background:var(--sun-soft);border-radius:999px;padding:4px 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.prog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.prog .r{display:flex;flex-direction:column;gap:6px}
.prog .h{display:flex;justify-content:space-between;font-size:14px}
.prog .h b{font-weight:600}
.prog .h span{color:var(--muted)}
.ob{min-height:calc(100vh - 160px);display:flex;flex-direction:column;gap:18px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.ob-dots i.on{background:var(--sky)}
.ob h1{margin:10px 0 0;font-size:27px;font-weight:700;line-height:1.25;text-wrap:balance}
.ob .sub{font-size:15px;color:var(--muted);margin-top:-8px}
.ob .hero{font-family:var(--f-han);font-weight:800;font-size:64px;color:var(--btn);line-height:1.1;margin-top:30px}
.choice{width:100%;min-height:58px;padding:14px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:16px;display:flex;align-items:center;gap:12px}
.choice .ck{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff}
.choice.multi .ck{border-radius:8px}
.choice[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.choice[aria-pressed="true"] .ck{background:var(--btn);border-color:var(--btn)}
.goal-chip{display:inline-flex;align-self:flex-start;font-size:13px;font-weight:600;color:var(--sky-ink);background:var(--sky-soft);border-radius:999px;padding:5px 12px;margin-top:-6px}
.danger{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--bad);font-weight:600;text-align:center}
.confirm{background:var(--bad-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.confirm div{display:flex;gap:10px}
.confirm button{flex:1;height:46px;border-radius:14px;font-weight:700;text-align:center;background:var(--card)}
.confirm button.y{background:var(--bad);color:#fff}
.hello div{font-size:15px;color:var(--muted)}
.hello h1{margin:2px 0 0;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.hrow{display:flex;align-items:center;gap:16px;padding:20px;border-radius:22px;background:var(--card);border:1px solid var(--line);width:100%}
.hrow .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.hrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow b{font-size:20px;font-weight:700}
.hrow .s{font-size:13px;color:var(--muted)}
.hrow.dash{background:transparent;border:1px dashed var(--line);padding:18px 20px}
.hrow.dash b{font-size:17px;font-weight:600}
.streak{text-align:center;font-family:var(--f-hand);font-size:22px;color:var(--pink);margin-top:18px}


.sec{font-size:13px;font-weight:700;color:var(--muted);margin:10px 2px -4px}
.lc{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;width:100%}
.lc.fel{background:var(--sky-soft)}
.lc.ibora{background:var(--pink-soft)}
.lc .tl{width:58px;height:58px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;font-family:var(--f-han);font-weight:800;font-size:18px;color:#fff}
.lc.fel .tl{background:var(--btn);color:var(--btn-ink)}
.lc.ibora .tl{background:var(--pink)}
.lc .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lc b{font-size:19px;font-weight:700}
.lc .s{font-size:13px;font-weight:600}
.lc.fel .s{color:var(--sky-ink)}
.lc.ibora .s{color:var(--pink-ink)}
.lc .bar{background:var(--card)}
.lc.ibora .bar i{background:var(--pink)}
.mx{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:26px;background:var(--hero);color:var(--hero-ink);width:100%}
.mx .gh{position:absolute;right:-14px;bottom:-34px;font-family:var(--f-han);font-weight:800;font-size:130px;line-height:1;color:var(--hero-line);pointer-events:none}
.mx .r1{position:relative;display:flex;align-items:center;gap:12px}
.mx .ic{width:46px;height:46px;border-radius:14px;background:var(--sun);color:#5C430A;display:grid;place-items:center;flex:0 0 auto}
.mx b{font-size:20px;display:block}
.mx .s{font-size:13px;color:var(--hero-mut)}
.mx .chips{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.mx .chips span{font-size:13px;font-weight:600;background:var(--hero-line);border-radius:999px;padding:6px 12px}
.mx .cta{position:relative;height:50px;border-radius:16px;background:var(--sun);color:#3D2C05;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.mx.off .cta{background:var(--hero-line);color:var(--hero-mut)}

/* week & day cards */
.wk{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);width:100%}
.wk.now{border:2px solid var(--sky)}
.wk.pinknow{border:2px solid var(--pink)}
.wk.lock{opacity:.6}
.wk .tile{width:54px;height:54px;flex:0 0 auto;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft);color:var(--muted)}
.wk .tile b{font-size:20px;font-weight:800;line-height:1}
.wk .tile span{font-size:10px;font-weight:700}
.wk .tile.han{font-family:var(--f-han);font-weight:800;font-size:16px}
.wk.done .tile{background:var(--ok-soft);color:var(--ok)}
.wk.now .tile{background:var(--btn);color:var(--btn-ink)}
.wk.pinknow .tile{background:var(--pink-soft);color:var(--pink-ink)}
.wk .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wk .r{display:flex;justify-content:space-between;gap:8px}
.wk .r b{font-size:16px}
.wk .st{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.wk.done .st{color:var(--ok)}
.wk .ex{font-family:var(--f-ko);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.day{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);width:100%}
.day.now{border:2px solid var(--sky)}
.day.lock{opacity:.6}
.day .r{display:flex;align-items:center;gap:10px}
.day .n{width:30px;height:30px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--soft);color:var(--muted)}
.day.done .n{background:var(--ok-soft);color:var(--ok)}
.day.now .n{background:var(--pink);color:#fff}
.day .r b{flex:1;font-size:15px}
.day .st{font-size:12px;font-weight:700;color:var(--muted)}
.day.done .st{color:var(--ok)}
.day.now .st{color:var(--pink-ink)}
.day .w{font-family:var(--f-ko);font-size:15px;color:var(--muted);line-height:1.45}
.day .go{height:46px;border-radius:14px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.tp{font-size:11px;font-weight:700;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:2px 7px;white-space:nowrap}

/* lesson */
.steps{flex:1;display:flex;gap:4px}
.steps i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.steps i.on{background:var(--pink)}
.steps i.q{background:var(--soft);outline:1px dashed var(--line)}
.steps i.q.on{background:var(--sky);outline:0}
.word{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 20px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.word .big{font-family:var(--f-han);font-weight:800;font-size:52px;line-height:1.15;margin:0;text-wrap:balance}
.word .big.long{font-size:34px}
.word .mean{font-size:20px;font-weight:700;margin-top:4px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.blk .k{font-family:var(--f-ko);font-size:17px;line-height:1.5}
.blk .v{font-size:15px}
.blk.sun{background:var(--sun-soft);border-color:transparent}
.forms{display:flex;flex-direction:column}
.forms div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--soft)}
.forms div:first-child{border-top:0;padding-top:2px}
.forms span{font-size:13px;color:var(--muted);font-weight:600}
.forms b{font-family:var(--f-ko);font-weight:400;font-size:20px}
mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qbar{flex:1;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:10px;background:var(--sky);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-ink)}
.prompt{display:flex;flex-direction:column;gap:6px}
.prompt .pk{font-family:var(--f-han);font-weight:800;font-size:40px;line-height:1.2}
.prompt .ps{font-family:var(--f-ko);font-size:24px;line-height:1.45}
.prompt .pu{font-size:20px;font-weight:700;line-height:1.35}
.prompt .pkm{font-family:var(--f-ko);font-size:19px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.prompt .h{font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:58px;padding:12px 16px;background:var(--card);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:16px;font-weight:600;font-size:16px;line-height:1.35}
.opt.k{font-family:var(--f-ko);font-weight:400;font-size:19px}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:16px;padding:12px 16px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb span{font-weight:500;color:var(--ink)}

/* result */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:20px}
.res .big{font-size:72px;font-weight:800;line-height:1;color:var(--btn);font-variant-numeric:tabular-nums}
.res .em{font-family:var(--f-han);font-weight:800;font-size:44px;color:var(--btn);line-height:1.1}
.res .hand{font-family:var(--f-hand);font-size:26px;color:var(--pink)}
.rank{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--ok-soft);text-align:left}
.rank b{font-size:26px;color:var(--ok)}
.rank.flat{background:var(--soft)}
.rank.flat b{color:var(--muted)}
.list{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left}
.list>div{padding:12px 16px;border-top:1px solid var(--soft);display:flex;justify-content:space-between;gap:12px}
.list>div:first-child{border-top:0}
.list .ko{font-size:16px;flex:0 0 auto;max-width:55%}
.list .u{font-size:13px;color:var(--muted);text-align:right}

/* mashq */
.mc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:26px;background:var(--card);border:1px solid var(--line);width:100%;min-height:200px}
.mc .gh{position:absolute;right:-10px;top:-16px;font-family:var(--f-han);font-weight:800;font-size:120px;line-height:1;color:var(--soft);pointer-events:none}
.mc b{position:relative;font-size:24px}
.mc .s{position:relative;font-size:14px;color:var(--muted)}
.mc .go{position:relative;margin-top:auto;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;background:var(--btn)}
.mc .go.p{background:var(--pink)}
.mc.off{opacity:.65}
.pill{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--sun-soft);width:100%}
.pill .i{width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--sun-ink);flex:0 0 auto}
.pill b{font-size:16px;display:block}
.pill span{font-size:13px;color:var(--muted)}

/* reyting */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{height:40px;border-radius:10px;text-align:center;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;padding-top:6px}
.pod>div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .av{border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--ink)}
.pod b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-size:12px;color:var(--muted)}
.pod .col{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:22px;font-weight:800}
.lb{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.lb>div{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--soft)}
.lb>div:first-child{border-top:0}
.lb .r{width:22px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lb .av{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.lb b{flex:1;font-size:15px;font-weight:600}
.lb .p{font-weight:700;font-variant-numeric:tabular-nums}
.lb .me{background:var(--sky-soft)}
.lb .me b{font-weight:800}
.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}

/* action + toast */
.action{position:fixed;left:0;right:0;bottom:0;padding:14px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.action .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;height:56px;border-radius:18px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 40px);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function fetchLB(kind){return apiPost("/api/leaderboard",{kind}).then(d=>{if(d&&d.ok){LB[kind]=d;const v=cur&&cur();if(v&&["reyting","mashq","home","profil"].includes(v.v))render(true)}})}

const RIVALS=[["Dilnoza",124,610],["Jasur",112,540],["Madina",95,488],["Sardor",80,402],["Nigora",71,350],["Bekzod",64,297],["Malika",58,260],["Azizbek",41,190],["Shahzoda",33,150],["Otabek",20,96]];
function board(kind){
  const L=LB[kind];
  if(L){const list=L.top.map(x=>({name:x.me?x.name+" (siz)":x.name,p:x.p,r:x.r,me:x.me}));
    if(L.me&&!list.some(x=>x.me))list.push({name:L.me.name+" (siz)",p:L.me.p,r:L.me.r,me:true});return list}
  const me={name:ME?ME+" (siz)":"Siz",p:kind==="w"?wk():P.total,me:true};
  return [...RIVALS.map(r=>({name:r[0],p:kind==="w"?r[1]:r[2]})),me].sort((a,b)=>b.p-a.p||(a.me?-1:b.me?1:0)).map((x,i)=>Object.assign(x,{r:i+1}))}
const myRank=()=>{const b=board("w"),m=b.find(x=>x.me);return m?m.r:b.length+1};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hl=(s,h)=>{const i=h?s.indexOf(h):-1;return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(h)+"</mark>"+esc(s.slice(i+h.length))};

  cup:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>'};

function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=document.createElement("div");c.className="confetti";const cols=["#F2CF7C","#3E97E0","#C9B6E4","#E8578A"];

function act(h){$("#action").hidden=!h;$("#actIn").innerHTML=h||""}

/* ---------- Savol yasash ---------- */
function opts(t,idx,field,n=3){
  const items=DATA[t].items,ban=new Set([idx]);CONFLICT.forEach(p=>{if(t==="ibora"&&p.includes(idx))p.forEach(x=>ban.add(x))});
  const right=field(items[idx]);const seen=new Set([right]);const out=[];
  for(const j of shuf(items.map((_,k)=>k))){if(ban.has(j))continue;const v=field(items[j]);if(!v||seen.has(v))continue;seen.add(v);out.push(v);if(out.length===n)break}
  return shuf([right,...out]);
}
function makeQ(t,idx,type){
  const it=DATA[t].items[idx];
  if(t==="fel"){
    if(type===0)return{t,idx,lbl:"Ma'nosini toping",html:`<span class="pk">${esc(it.ko)}</span>`,ans:it.uz,o:opts(t,idx,x=>x.uz)};
    if(type===1)return{t,idx,lbl:"Koreyschasini toping",html:`<span class="pu">«${esc(it.uz)}»</span>`,ans:it.ko,o:opts(t,idx,x=>x.ko),k:1};
    const fi=it.f.findIndex(f=>it.ex[0].includes(f.split(" ").pop()));const form=it.f[fi<0?0:fi].split(" ").pop();
    return{t,idx,lbl:"Gapni to'ldiring",html:`<span class="ps">${esc(it.ex[0].replace(form,"____"))}</span><span class="h">«${esc(it.ex[1])}»</span>`,ans:form,o:opts(t,idx,x=>x.f[fi<0?0:fi].split(" ").pop()),k:1,full:it.ex[0]};
  }
  if(type===0)return{t,idx,lbl:"Ma'nosini toping",html:`<span class="pk" style="font-size:${it.ko.length>9?28:36}px">${esc(it.ko)}</span>`,ans:it.uz,o:opts(t,idx,x=>x.uz)};
  if(type===1)return{t,idx,lbl:"Qaysi idioma?",html:`<span class="pu">«${esc(it.uz)}»</span>`,ans:it.ko,o:opts(t,idx,x=>x.ko),k:1};
  return{t,idx,lbl:"TOPIK uslubi · koreyscha izoh",html:`<span class="pkm">${esc(it.kom)}</span><span class="h">Shu ma'noni beradigan idiomani tanlang</span>`,ans:it.ko,o:opts(t,idx,x=>x.ko),k:1};
}

/* ---------- Dars ---------- */
function startLesson(t,d){S.lesson={t,d,i:0,qs:shuf(DAYS[t][d].ids).slice(0,3).map((x,k)=>makeQ(t,x,[0,1,2][k])),qi:0,score:0,miss:[],ans:false,rank0:myRank()};go({v:"lesson"})}
function vLesson(){
  const L=S.lesson,ids=DAYS[L.t][L.d].ids,n=ids.length;
  const steps=`<div class="steps">${ids.map((_,k)=>`<i class="${k<=L.i?"on":""}"></i>`).join("")}${L.qs.map((_,k)=>`<i class="q ${L.i>=n&&k<=L.qi?"on":""}"></i>`).join("")}</div>`;
  const head=`<div class="qtop"><button class="ib" data-back aria-label="Yopish">${I.close}</button>${steps}</div>`;
  if(L.i<n){
    const it=DATA[L.t].items[ids[L.i]];
    let body;
    if(L.t==="fel"){
      const fi=it.f.findIndex(f=>it.ex[0].includes(f.split(" ").pop()));
      body=`<div class="word"><p class="big">${esc(it.ko)}</p><div class="mean">${esc(it.uz)}</div></div>
      <div class="blk"><span class="lbl">Zamonlar · hurmat uslubi</span><div class="forms">${["Hozirgi","O'tgan","Kelasi"].map((z,k)=>`<div><span>${z}</span><b>${esc(it.f[k])}</b></div>`).join("")}</div></div>
      <div class="blk sun"><span class="lbl">Misol</span><span class="k">${hl(it.ex[0],fi<0?"":it.f[fi].split(" ").pop())}</span><span class="v">${esc(it.ex[1])}</span></div>`;
    }else{
      body=`<div class="word"><p class="big ${it.ko.length>8?"long":""}">${esc(it.ko)}</p>${it.tp?`<span class="tp" style="margin-top:6px">${it.tp} · o'qish 21-savol</span>`:""}</div>
      ${it.lit?`<div class="blk"><span class="lbl">So'zma-so'z</span><span class="v">${esc(it.lit)}</span></div>`:""}
      <div class="blk sun"><span class="lbl">Ma'nosi</span><span class="v" style="font-weight:700;font-size:17px">${esc(it.uz)}</span></div>
      <div class="blk"><span class="lbl">Koreyscha izoh</span><span class="k">${esc(it.kom)}</span></div>`;
    }
    $("#app").innerHTML=`<div class="scr">${head}<div class="lbl">${dayLabel(L.t,L.d)} · ${L.i+1} / ${n}</div>${body}</div>`;
    act(`${L.i>0?`<button class="btn" id="pv" style="flex:0 0 56px" aria-label="Oldingi">${I.back}</button>`:""}<button class="btn pri" id="nx">${L.i<n-1?"Keyingi":"Savollarga o'tish"}</button>`);
    $("#nx").onclick=()=>{hap.t();L.i++;render()};
    $("#pv")&&($("#pv").onclick=()=>{hap.t();L.i--;render()});
    return;
  }
  if(L.qi<L.qs.length){$("#app").innerHTML=`<div class="scr">${head}${qHTML(L.qs[L.qi])}</div>`;bindQ(L,()=>{L.qi++;L.ans=false;render()},L.qi===L.qs.length-1);return}
  // natija
  const first=!isDone(L.t,L.d);if(first){P.done[L.t].push(L.d);save()}
  if(!L.counted){L.counted=1;if(L.score)addPts(L.score);if(first)confetti();hap.ok()}
  const nd=L.d+1<DAYS[L.t].length?L.d+1:-1;
  $("#app").innerHTML=`<div class="scr"><div class="res">
    <div class="em">잘했어요!</div><div class="hand">${first?dayLabel(L.t,L.d)+" tugadi":"takrorlandi"}</div>
    <div style="font-size:16px;font-weight:600;margin-top:6px">${L.score} / ${L.qs.length} to'g'ri · +${L.score} ball</div>
    ${rankHTML(L.rank0)}
    ${L.miss.length?`<div class="lbl" style="align-self:flex-start;margin-top:6px">Yana bir ko'rib qo'ying</div>${missHTML(L.miss)}`:""}
  </div></div>`;
  act(`<button class="btn" id="hm" style="flex:0 0 auto;padding:0 18px">Bosh sahifa</button>${nd>=0?`<button class="btn pri" id="nd">Keyingi kun</button>`:""}`);
  $("#hm").onclick=home;
  $("#nd")&&($("#nd").onclick=()=>{ST.pop();if(cur().v==="week"&&Math.floor(nd/5)!==cur().w)cur().w=Math.floor(nd/5);startLesson(L.t,nd)});
}
function rankHTML(r0){const r1=myRank(),d=r0-r1;
  return `<button class="rank ${d>0?"":"flat"}" data-r><b>${d>0?"↑"+d:"#"+r1}</b><span style="flex:1"><span style="font-weight:700;display:block">${d>0?`${r0}-o'rindan ${r1}-o'ringa chiqdingiz`:`Reytingda ${r1}-o'rindasiz`}</span><span class="muted" style="font-size:13px">Bu hafta ${wk()} ball</span></span></button>`}
function missHTML(m){return `<div class="list">${m.map(q=>{const it=DATA[q.t].items[q.idx];return `<div><span class="ko">${esc(it.ko)}</span><span class="u">${esc(it.uz)}</span></div>`}).join("")}</div>`}
function qHTML(q){return `<div class="qt">${q.lbl}</div><div class="prompt">${q.html}</div>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt ${q.k?"k":""}" data-o="${i}">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`}
function bindQ(st,next,last){
  const q=st.qs?st.qs[st.qi]:st.list[st.i];
  $$(".opt").forEach(b=>b.onclick=()=>{
    if(st.ans)return;st.ans=true;const ok=q.o[b.dataset.o]===q.ans;
    $$(".opt").forEach(x=>{x.disabled=true;if(q.o[x.dataset.o]===q.ans)x.classList.add("right")});
    if(ok){st.score++;hap.ok()}else{b.classList.add("wrong");st.miss.push(q);hap.no()}
    const it=DATA[q.t].items[q.idx];
    const extra=q.full?`<span class="ko" style="font-size:17px">${hl(q.full,q.ans)}</span>`:q.t==="ibora"?`<span>${esc(it.ko)} — ${esc(it.uz)}</span>`:"";
    $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}">${ok?"To'g'ri! +1 ball":"To'g'ri javob yashil bilan belgilandi"}${extra}</div>`;
    act(`<button class="btn pri" id="nq">${last?"Natijani ko'rish":"Davom etish"}</button>`);
    $("#nq").onclick=()=>{hap.t();next()};
    setTimeout(()=>{const f=$("#fb");f&&f.scrollIntoView({block:"nearest",behavior:"smooth"})},60);
  });
}

/* ---------- Mashq ---------- */
function pool(t){const p=P.done[t].flatMap(d=>DAYS[t][d].ids);return p.length?p:DATA[t].items.map((_,i)=>i)}
const learnedPool=t=>P.done[t].length>0;
function vMashq(){
  const r=myRank();
  const card=(t,gh,cls)=>{const p=pool(t).length;return `<button class="mc ${p?"":"off"}" data-q="${t}"><span class="gh" aria-hidden="true">${gh}</span><b>${t==="fel"?"Fe'l mashqi":"Ibora mashqi"}</b>
    <span class="s">${learnedPool(t)?`O'rgangan ${p} ta ${t==="fel"?"fe'lingizdan":"idiomangizdan"}`:`Barcha 100 ta ${t==="fel"?"fe'ldan":"idiomadan"}`}<br>10 ta savol</span><span class="go ${cls}">Boshlash</span></button>`};
  $("#app").innerHTML=`<div class="scr">${topBar("Mashq","1 ta to'g'ri javob = 1 ball")}
    <button class="pill" data-r><span class="i">${I.cup}</span><span style="flex:1"><b>Siz ${r}-o'rindasiz</b><span>Bu hafta ${wk()} ball${r>1?` · ${r-1}-o'ringa ${board("w")[r-2].p-wk()+1} ball qoldi`:" · birinchi o'rin!"}</span></span>${I.chev}</button>
    ${card("fel","동","")}${card("ibora","관","p")}
  </div>`;
  $$("[data-q]").forEach(b=>b.onclick=()=>{const t=b.dataset.q,p=pool(t);if(!p.length){hap.no();toast(`Avval ${LBL[t].toLowerCase()} bo'limida 1-kunni o'ting`);return}
    const ids=[];while(ids.length<10)ids.push(...shuf(p));
    S.quiz={t,i:0,score:0,miss:[],ans:false,rank0:myRank(),list:ids.slice(0,10).map((x,k)=>makeQ(t,x,k%3))};S.quiz.list=shuf(S.quiz.list);go({v:"quiz"})});
  bindR();
}
function bindR(){$$("[data-r]").forEach(b=>b.onclick=()=>go({v:"reyting",k:"w"}))}
function vQuiz(){
  const Q=S.quiz,n=Q.list.length;
  if(Q.i<n){
    $("#app").innerHTML=`<div class="scr"><div class="qtop"><button class="ib" data-back aria-label="Yopish">${I.close}</button><div class="qbar"><i style="width:${Q.i/n*100}%"></i></div><span class="qn">${Q.i+1}/${n}</span></div>${qHTML(Q.list[Q.i])}</div>`;
    bindQ(Q,()=>{Q.i++;Q.ans=false;render()},Q.i===n-1);return;
  }
  if(!Q.counted){Q.counted=1;if(Q.score)addPts(Q.score);if(Q.score>=8)confetti()}
  $("#app").innerHTML=`<div class="scr"><div class="res">
    <div class="muted" style="font-weight:600">${Q.t==="fel"?"Fe'l":"Ibora"} mashqi tugadi</div>
    <div class="big">+${Q.score}</div><div style="font-size:16px;font-weight:600">ball · ${n} tadan ${Q.score} tasi to'g'ri</div>
    ${rankHTML(Q.rank0)}
    ${Q.miss.length?`<div class="lbl" style="align-self:flex-start;margin-top:6px">Xato qilinganlar</div>${missHTML(Q.miss)}`:`<div class="hand">mukammal!</div>`}
  </div></div>`;
  act(`<button class="btn" id="fin" style="flex:0 0 auto;padding:0 18px">Tugatish</button><button class="btn pri" id="ag">Yana 10 ta savol</button>`);
  $("#fin").onclick=()=>{ST.pop();render()};
  $("#ag").onclick=()=>{ST.pop();render();$(`[data-q="${Q.t}"]`).click()};
  bindR();
}

/* ---------- Reyting ---------- */
function vReyting(v){
  const B=board(v.k),top3=B.slice(0,3),meI=B.findIndex(x=>x.me);
  const order=[1,0,2].map(i=>top3[i]).filter(Boolean),H={0:"92px",1:"64px",2:"46px"},SZ={0:68,1:56,2:52};
  const COL={0:["var(--mark)","var(--ink)"],1:["var(--sky-soft)","var(--sky-ink)"],2:["var(--pink-soft)","var(--pink-ink)"]};
  const rest=B.slice(3,Math.max(8,meI+1));
  $("#app").innerHTML=`<div class="scr">${topBar("Reyting","Kim ko'p to'g'ri javob topdi")}
    <div class="seg"><button data-k="w" aria-pressed="${v.k==="w"}">Bu hafta</button><button data-k="a" aria-pressed="${v.k==="a"}">Umumiy</button></div>
    <div class="pod">${order.map(p=>{const r=B.indexOf(p);return `<div><span class="av" style="width:${SZ[r]}px;height:${SZ[r]}px;${p.me?"background:var(--sky-soft);color:var(--sky-ink)":""}">${esc(p.name[0])}</span><b>${esc(p.name)}</b><small>${p.p} ball</small><span class="col" style="height:${H[r]};background:${COL[r][0]};color:${COL[r][1]}">${r+1}</span></div>`}).join("")}</div>
    <div class="lb">${rest.map(p=>{const r=p.r||B.indexOf(p)+1;return `<div class="${p.me?"me":""}"><span class="r">${r}</span><span class="av">${esc(p.name[0])}</span><b>${esc(p.name)}</b><span class="p">${p.p}</span></div>`}).join("")}</div>
    <div class="note">${v.k==="w"?"«Bu hafta» har dushanba 0 dan boshlanadi. ":""}1 to'g'ri javob = 1 ball.${LB[v.k]?"":"<br>Demo: boshqa ishtirokchilar hozircha namuna."}</div>
  </div>`;
  $$("[data-k]").forEach(b=>b.onclick=()=>{hap.t();replace({v:"reyting",k:b.dataset.k})});
  if(!v.f){v.f=1;fetchLB(v.k)}
}

/* ---------- Profil ---------- */
function level(n){return n>=150?"Ustoz darajasi":n>=100?"Ilg'or":n>=50?"O'rta":n>=10?"Boshlovchi":"Yangi o'quvchi"}
function vProfil(v){
  const lf=learned("fel"),li=learned("ibora"),all=lf+li,r=myRank();
  const name=TU?[TU.first_name,TU.last_name].filter(Boolean).join(" "):"Mehmon";
  const prog=t=>{const l=learned(t),tot=DATA[t].items.length,d=P.done[t].length;return `<div class="r"><div class="h"><b>${LBL[t]}</b><span>${l} / ${tot} · ${d} / ${DAYS[t].length} kun</span></div><div class="bar ${t==="ibora"?"pink":""}"><i style="width:${l/tot*100}%"></i></div></div>`};
  $("#app").innerHTML=`<div class="scr">${topBar("Profil","")}
    <div class="pf-head"><div class="pf-av">${avHTML()}</div><h2>${esc(name)}</h2>${TU&&TU.username?`<div class="u">@${esc(TU.username)}</div>`:""}<span class="pf-lvl">${level(all)}</span></div>
    <div class="stats"><div class="stat"><b>${all}</b><span>so'z o'rganildi</span></div><div class="stat"><b>${P.total}</b><span>jami ball</span></div><div class="stat"><b>${P.streak.n||0}</b><span>kun ketma-ket</span></div></div>
    <button class="pill" data-r><span class="i">${I.cup}</span><span style="flex:1"><b>Reytingda ${r}-o'rin</b><span>Bu hafta ${wk()} ball</span></span>${I.chev}</button>
    ${P.ob?`<div class="lbl" style="margin-top:4px">Men haqimda</div><div class="list" style="width:100%">
      ${[["Yosh",P.ob.age],["Maqsad",P.ob.goal],["Daraja",P.ob.lvl],["Qiyinchilik",(P.ob.prob||[]).join(", ")]].filter(x=>x[1]).map(x=>`<div><span class="muted" style="font-size:14px">${x[0]}</span><span style="font-size:14px;font-weight:600;text-align:right">${esc(x[1])}</span></div>`).join("")}</div>
      <button class="hrow dash" data-ob style="padding:14px 18px"><span class="c" style="gap:0"><b style="font-size:15px">Javoblarni o'zgartirish</b></span>${I.chev}</button>`:""}
    <div class="lbl" style="margin-top:4px">Progress</div>
    <div class="prog">${prog("fel")}${prog("ibora")}</div>
    ${v.ask?`<div class="confirm"><b style="color:var(--bad)">Butun progress va ballar o'chiriladi. Ishonchingiz komilmi?</b><div><button data-no>Bekor qilish</button><button class="y" data-yes>Ha, o'chirish</button></div></div>`
      :`<button class="danger" data-reset>Progressni boshidan boshlash</button>`}
  </div>`;
  bindR();
  const ob=$("[data-ob]");ob&&(ob.onclick=()=>go({v:"ob",step:1,a:Object.assign({},P.ob),edit:1}));
  const rs=$("[data-reset]");rs&&(rs.onclick=()=>replace({v:"profil",ask:1}));
  const no=$("[data-no]");no&&(no.onclick=()=>replace({v:"profil"}));
  const yes=$("[data-yes]");yes&&(yes.onclick=()=>{P={done:{fel:[],ibora:[]},total:0,week:{k:weekKey(),n:0},streak:{n:0,d:""},ob:P.ob};save();hap.ok();toast("Progress tozalandi");replace({v:"profil"})});
}

/* ---------- Ro'yxatdan o'tish (onboarding) ---------- */
const OBQ=[
  {k:"age",q:"Yoshingiz nechida?",o:["17 yoshgacha","18–24","25–34","35 va undan katta"]},
  {k:"goal",q:"Koreys tilini nima maqsadda o'rganyapsiz?",o:["TOPIK I","TOPIK II","Koreyaga ishga borish","Koreyada o'qish","O'zim uchun, qiziqish"]},
  {k:"lvl",q:"Hozir qaysi darajadasiz?",o:["Endi boshlayapman","Alifboni bilaman","TOPIK I darajasida","TOPIK II darajasida"]},
  {k:"prob",q:"Sizga eng ko'p nima qiyinchilik tug'diryapti?",sub:"Bir nechtasini tanlashingiz mumkin",multi:1,o:["So'zlar esdan chiqib ketadi","Grammatika qiyin","Gapira olmayman","Vaqtim yetmaydi","Motivatsiya yetishmaydi","Qayerdan boshlashni bilmayman"]}
];
function sendOb(a){
  try{const init=tg&&tg.initData;if(!init)return;
    fetch("/api/onboarding",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:init,answers:a})}).catch(()=>{})}catch(e){}
}
function vOb(v){
  const n=OBQ.length,step=v.step,a=v.a;
  const dots=`<div class="ob-dots">${OBQ.map((_,k)=>`<i class="${k<step?"on":""}"></i>`).join("")}</div>`;
  if(step===0){
    $("#app").innerHTML=`<div class="scr ob"><div class="hero">안녕하세요!</div>
      <h1>Salom${ME?", "+esc(ME):""}! Keling, tanishib olamiz</h1>
      <div class="sub">4 ta qisqa savol. Javoblaringiz asosida darslarni sizga moslab beramiz.</div></div>`;
    act(`<button class="btn pri" id="ob-go">Boshlash</button>`);
    $("#ob-go").onclick=()=>{hap.t();replace({v:"ob",step:1,a})};return;
  }
  const Q=OBQ[step-1],val=a[Q.k];
  const on=o=>Q.multi?(val||[]).includes(o):val===o;
  $("#app").innerHTML=`<div class="scr ob">${v.edit?topBar("Javoblarni o'zgartirish",""):""}${dots}
    <h1>${Q.q}</h1>${Q.sub?`<div class="sub">${Q.sub}</div>`:""}
    <div style="display:flex;flex-direction:column;gap:10px">${Q.o.map((o,i)=>`<button class="choice ${Q.multi?"multi":""}" data-c="${i}" aria-pressed="${on(o)}"><span class="ck">${on(o)?"✓":""}</span>${esc(o)}</button>`).join("")}</div></div>`;
  $$("[data-c]").forEach(b=>b.onclick=()=>{hap.t();const o=Q.o[b.dataset.c];
    if(Q.multi){const l=new Set(a[Q.k]||[]);l.has(o)?l.delete(o):l.add(o);a[Q.k]=[...l];replace(v)}
    else{a[Q.k]=o;if(step<n)replace({...v,step:step+1});else replace(v)}});
  const ready=Q.multi?(a[Q.k]||[]).length>0:!!val;
  act(`${step>1?`<button class="btn" id="ob-b" style="flex:0 0 56px" aria-label="Orqaga">${I.back}</button>`:""}<button class="btn pri" id="ob-n" ${ready?"":"disabled style=\"opacity:.5\""}>${step<n?"Keyingi":"Tayyor"}</button>`);
  $("#ob-b")&&($("#ob-b").onclick=()=>{hap.t();replace({...v,step:step-1})});
  $("#ob-n").onclick=()=>{if(!ready){hap.no();toast("Variantlardan birini tanlang");return}hap.t();
    if(step<n){replace({...v,step:step+1});return}
    P.ob=Object.assign({},a,{at:new Date().toISOString()});save();sendOb(P.ob);hap.ok();
    if(v.edit){toast("Javoblar saqlandi");ST.pop();render()}else{confetti();home()}};
}

render();
if(ONLINE)apiPost("/api/me").then(d=>{if(d&&d.access===false){DENIED=true;render()}else{fetchLB("w");scheduleSync()}});

</script>
